<div style="padding: 40px; font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
  <h1>Pedidos360</h1>
  <p>Sistema de gestion de pedidos - Frontend</p>

  <div *ngIf="!loginDisplay" style="margin-top: 30px;">
    <p>No has iniciado sesion.</p>
    <button (click)="login()" 
            style="padding: 12px 24px; font-size: 16px; background-color: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Iniciar sesion con Microsoft
    </button>
  </div>

  <div *ngIf="loginDisplay" style="margin-top: 30px;">
    <p style="color: green; font-weight: bold;">Sesion iniciada</p>
    <button (click)="logout()"
            style="padding: 10px 20px; margin-right: 10px; background-color: #d13438; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Cerrar sesion
    </button>
    <a routerLink="/profile"
       style="padding: 10px 20px; background-color: #107c10; color: white; text-decoration: none; border-radius: 4px;">
      Ver perfil (protegido)
    </a>
  </div>
</div>
